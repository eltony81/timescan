version: '3.8'

services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./e2e/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: webhook
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  timescan-e2e:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: timescan-e2e
    depends_on:
      - prometheus
      - webhook
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - WEBHOOK_URL=http://webhook:8080/alerts
      - CSV_PATH=/data/metrics.csv
    volumes:
      - ./e2e/data:/data:z
